name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker build + smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cicd-pipeline:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and hit /health
        run: |
          docker run -d --name app -p 8080:8080 cicd-pipeline:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/version | tee /dev/stderr | grep -q "${{ github.sha }}"
      - name: Container logs
        if: always()
        run: docker logs app || true

  publish:
    name: Publish image to GHCR
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploy to AWS Lambda
    needs: docker
    # Runs only on main, and only once AWS is configured (see docs/aws-setup.md).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC: no long-lived AWS keys stored in GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'cicd-pipeline' }}
      FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION || 'cicd-pipeline' }}
      LAMBDA_ROLE_ARN: ${{ vars.LAMBDA_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG show OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info(`sub=${c.sub}`);
            core.info(`aud=${c.aud}`);
            core.info(`iss=${c.iss}`);
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false # Lambda rejects multi-manifest image indexes
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
      - id: deploy
        name: Update Lambda function
        run: ./scripts/deploy_lambda.sh "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
      - name: Smoke test live URL
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            if curl -fsS "${url}health"; then echo; break; fi
            sleep 3
          done
          curl -fsS "${url}version" | tee /dev/stderr | grep -q "${{ github.sha }}"

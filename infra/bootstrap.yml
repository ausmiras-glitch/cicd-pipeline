AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for the cicd-pipeline CI/CD pipeline: ECR repository,
  Lambda execution role, and a GitHub Actions OIDC deploy role (no stored AWS keys).

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub username or organization that owns the repository
  GitHubRepo:
    Type: String
    Default: cicd-pipeline
  RepositoryName:
    Type: String
    Default: cicd-pipeline
  FunctionName:
    Type: String
    Default: cicd-pipeline
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this AWS account already has the GitHub OIDC provider

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository: !Sub ${GitHubOwner}/${GitHubRepo}
                token.actions.githubusercontent.com:environment: production
              StringLike:
                # IAM requires a "sub" condition. GitHub now embeds numeric owner
                # and repo ids in it, so both shapes are allowed here; the exact
                # repository and environment are pinned by StringEquals above.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:production
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepo}@*:environment:production
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:AddPermission
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn

Outputs:
  AwsRoleArn:
    Description: GitHub variable AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  LambdaRoleArn:
    Description: GitHub variable LAMBDA_ROLE_ARN
    Value: !GetAtt LambdaExecutionRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
